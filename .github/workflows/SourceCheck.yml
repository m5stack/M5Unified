# SourceCheck.yml
name: SourceCheck

on:
  push:
    paths:
    - 'src/**'
    - '**check_inl_sources.py'
    - '**SourceCheck.yml'
  pull_request:

  workflow_dispatch:

jobs:

  inl-sources:

    name: single translation unit consistency

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check the hub and the *.inl files
        run: |
          python3 .github/scripts/check_inl_sources.py \
            --hub src/M5Unified.cpp --root src --macro M5UNIFIED_IMPLEMENTATION
