name: Arduino Build

on:
  push:
    paths:
      - '**.ino'
      - '**.cpp'
      - '**.inl'
      - '**.hpp'
      - '**.h'
      - '**.c'
      - '.github/workflows/ArduinoBuild.yml'
  pull_request:
  workflow_dispatch:

# supersede queued/running builds of the same branch or PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.board }} (${{ matrix.esp32_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Older arduino-esp32 releases are split between the M5GFX and M5Unified CIs: each series from
          # 2.0 to 3.2, and the oldest 3.3 with ESP32-C5, is built by only one of them. The M5Unified CI
          # builds M5GFX from its develop / master branch, so an M5GFX pull request itself is not built
          # on the releases listed only there (3.0 / 3.2). M5Unified is built only on the releases
          # listed in the M5Unified CI.
          # The latest release of each current series (3.3 and 4.0) is built by both CIs on
          # esp32 / s3 / c5 / p4, so a PR to either repository is checked against the versions
          # most users install.
          # Minimums: C6 / H2 3.0, P4 3.1, C5 3.3.
          # The esp32p4 board targets chip revisions before 3 by default on 3.3 and revision 3 or
          # later from 4.0; the other revision is built with ChipVariant (postv3 / prev3).
          # Espressif Board Manager: 3.0.7
          - board: esp32:esp32:esp32
            esp32_version: 3.0.7
            board_manager_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          - board: esp32:esp32:esp32s3
            esp32_version: 3.0.7
            board_manager_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          - board: esp32:esp32:esp32c3
            esp32_version: 3.0.7
            board_manager_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          - board: esp32:esp32:esp32c6
            esp32_version: 3.0.7
            board_manager_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          - board: esp32:esp32:esp32h2
            esp32_version: 3.0.7
            board_manager_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          # Espressif Board Manager: 3.2.1
          - board: esp32:esp32:esp32
            esp32_version: 3.2.1
            board_manager_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          - board: esp32:esp32:esp32s3
            esp32_version: 3.2.1
            board_manager_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          - board: esp32:esp32:esp32c6
            esp32_version: 3.2.1
            board_manager_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          - board: esp32:esp32:esp32p4
            esp32_version: 3.2.1
            board_manager_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          # Latest release of each current series, built by both CIs.
          # Espressif Board Manager: 3.3.13 (latest 3.3)
          - board: esp32:esp32:esp32
            esp32_version: 3.3.13
            board_manager_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          - board: esp32:esp32:esp32s3
            esp32_version: 3.3.13
            board_manager_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          - board: esp32:esp32:esp32c5
            esp32_version: 3.3.13
            board_manager_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          - board: esp32:esp32:esp32p4
            esp32_version: 3.3.13
            board_manager_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          - board: esp32:esp32:esp32p4:ChipVariant=postv3
            esp32_version: 3.3.13
            board_manager_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          # Espressif Board Manager: 4.0.0 (latest)
          - board: esp32:esp32:esp32
            esp32_version: 4.0.0
            board_manager_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          - board: esp32:esp32:esp32s3
            esp32_version: 4.0.0
            board_manager_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          - board: esp32:esp32:esp32c5
            esp32_version: 4.0.0
            board_manager_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          - board: esp32:esp32:esp32p4
            esp32_version: 4.0.0
            board_manager_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          - board: esp32:esp32:esp32p4:ChipVariant=prev3
            esp32_version: 4.0.0
            board_manager_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          # M5Stack Board Manager
          - board: m5stack:esp32:m5stack_core
            esp32_version: 3.2.5
            board_manager_url: https://static-cdn.m5stack.com/resource/arduino/package_m5stack_index.json
          - board: m5stack:esp32:m5stack_cores3
            esp32_version: 3.2.5
            board_manager_url: https://static-cdn.m5stack.com/resource/arduino/package_m5stack_index.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine M5GFX repo and branch
        id: m5gfx
        run: |
          OWNER="${{ github.repository_owner }}"
          BRANCH="${{ github.base_ref || github.ref_name }}"
          [ "$BRANCH" = "master" ] || BRANCH="develop"
          # Prefer same owner's fork (e.g. <owner>/M5GFX); fall back to upstream m5stack/M5GFX
          if git ls-remote --heads "https://github.com/$OWNER/M5GFX.git" "$BRANCH" 2>/dev/null | grep -q .; then
            REPO="$OWNER/M5GFX"
          else
            REPO="m5stack/M5GFX"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "repo=$REPO"     >> "$GITHUB_OUTPUT"
          echo "Using $REPO@$BRANCH"

      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh -s 1.1.1
          echo "$PWD/bin" >> $GITHUB_PATH

      - name: Configure arduino-cli
        run: |
          arduino-cli config init
          # The M5Stack index is intermittently unavailable. Try the primary URL
          # first and fall back to the CN mirror. Either index is then passed
          # through a patch script that fixes stale toolsDependencies entries
          # (the CN index renames all tools with a "-cn" suffix but older
          # platforms still reference the pre-rename versions); the script is a
          # no-op on a consistent index.
          if [[ "${{ matrix.board_manager_url }}" == *package_m5stack_index*.json ]]; then
            PRIMARY="${{ matrix.board_manager_url }}"
            INDEX=/tmp/package_m5stack_index.json
            for url in "$PRIMARY" "${PRIMARY%.json}_cn.json"; do
              if curl -fsSL "$url" -o "$INDEX"; then
                echo "Using board manager index: $url"
                break
              fi
              echo "Board manager index unreachable: $url"
            done
            [ -s "$INDEX" ] || { echo "No reachable board manager index"; exit 1; }
            python3 .github/scripts/fix_m5stack_package_index.py "$INDEX"
            arduino-cli config add board_manager.additional_urls "file://$INDEX"
          else
            arduino-cli config add board_manager.additional_urls ${{ matrix.board_manager_url }}
          fi

      - name: Install board package
        run: |
          arduino-cli core update-index
          # Extract core (package:architecture) from FQBN (package:architecture:board)
          CORE=$(echo "${{ matrix.board }}" | cut -d: -f1,2)
          arduino-cli core install "${CORE}@${{ matrix.esp32_version }}"

      - name: Install libraries (M5Unified self + M5GFX matched branch)
        run: |
          mkdir -p "$HOME/Arduino/libraries"
          ln -s "$GITHUB_WORKSPACE" "$HOME/Arduino/libraries/M5Unified"
          git clone --depth 1 --branch "${{ steps.m5gfx.outputs.branch }}" \
            "https://github.com/${{ steps.m5gfx.outputs.repo }}.git" \
            "$HOME/Arduino/libraries/M5GFX"

      - name: Build
        run: |
          arduino-cli compile --fqbn ${{ matrix.board }} examples/Test/build_test/build_test.ino
